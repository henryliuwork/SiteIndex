# 每次推送自动校验数据。需要在仓库 Secrets 中添加 TOOLKIT_TOKEN（对 site-ops-toolkit 有只读权限的 fine-grained token）
name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: site }
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/site-ops-toolkit
          token: ${{ secrets.TOOLKIT_TOKEN }}
          path: site-ops-toolkit
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema
      - run: python site-ops-toolkit/scripts/validate.py site
