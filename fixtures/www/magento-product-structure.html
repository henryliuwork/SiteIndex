<!doctype html>
<html lang="en">
<head>
  <title>Sample outdoor product</title>
  <meta name="description" content="A fictional product page used to test Magento markup extraction.">
  <script type="application/ld+json">
    {"@context":"https://schema.org","@graph":[
      {"@type":"https://schema.org/Product","name":"Sample outdoor product","description":"Synthetic fixture description."}
    ]}
  </script>
</head>
<body>
  <main id="maincontent">
    <nav class="breadcrumbs" aria-label="Breadcrumb"><ul><li>Home</li><li>Outdoor</li><li>Sample item</li></ul></nav>
    <div class="product-info-main">
      <h1>Sample outdoor product</h1>
      <div class="product-info-price"><div class="price-box"><span class="price" data-price-amount="25.50">$25.50</span></div></div>
      <div class="product-reviews-summary"><div class="rating-summary">
        <div class="rating-result" title="90%"><span>90%</span></div>
        <div class="reviews-actions"><a>2 Reviews</a></div>
      </div></div>
    </div>
    <div class="product media"><div class="gallery-placeholder">
      <div class="fotorama__stage__frame"><img src="/media/sample-thumb.jpg" data-zoom-image="/media/sample-front.jpg" alt="Sample front view"></div>
      <div class="fotorama__nav__frame"><img data-src="/media/sample-side.jpg" alt="Sample side view"></div>
    </div></div>
    <p>This sample item includes synthetic copy for deterministic tests.</p>
  </main>

</html>
