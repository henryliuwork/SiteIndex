name: E · Windows v0.9.0 unified packaged acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Exact v0.9.0 candidate release workflow branch"
        required: true
      candidate_run_id:
        description: "Successful release.yml workflow_dispatch run ID"
        required: true
      candidate_artifact_id:
        description: "siteindex-win Actions artifact ID"
        required: true
      candidate_commit:
        description: "Full candidate commit SHA"
        required: true
      candidate_archive_sha256:
        description: "Actions artifact ZIP SHA256"
        required: true
      candidate_exe_sha256:
        description: "Candidate NSIS EXE SHA256"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  acceptance:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      SITEINDEX_RUNNER_ENVIRONMENT: github-hosted
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
      CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      CANDIDATE_ARCHIVE_SHA256: ${{ inputs.candidate_archive_sha256 }}
      CANDIDATE_EXE_SHA256: ${{ inputs.candidate_exe_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reject two injected harness faults
        run: node packages/desktop/scripts/acceptance/negative-selftest.mjs
      - name: Download pinned official baselines
        shell: pwsh
        run: |
          gh release download v0.8.4 --repo henryliuwork/SiteIndex --pattern SiteIndex-Setup-0.8.4.exe --dir pinned-baseline
          gh release download v0.8.5 --repo henryliuwork/SiteIndex --pattern SiteIndex-Setup-0.8.5.exe --dir pinned-baseline
          if ((Get-FileHash -LiteralPath pinned-baseline/SiteIndex-Setup-0.8.4.exe -Algorithm SHA256).Hash -ine '20b17cb1c3e6f813df93b8fda2ad6ab1aaa3fb6f31641dcd73df9d88c6a4d7d6') { throw 'v0.8.4 EXE SHA256 mismatch' }
          if ((Get-FileHash -LiteralPath pinned-baseline/SiteIndex-Setup-0.8.5.exe -Algorithm SHA256).Hash -ine '48c6b56d8388a3602a648615fcbf16bd15cb8f14d3465de474f89b1f265a3b62') { throw 'v0.8.5 EXE SHA256 mismatch' }
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          path: pinned-candidate
          digest-mismatch: error
      - name: Pin candidate and verify packaged double install
        shell: pwsh
        run: |
          if ($env:CANDIDATE_RUN_ID -notmatch '^[0-9]+$' -or $env:CANDIDATE_ARTIFACT_ID -notmatch '^[0-9]+$' -or $env:CANDIDATE_COMMIT -notmatch '^[0-9a-fA-F]{40}$' -or $env:CANDIDATE_ARCHIVE_SHA256 -notmatch '^[0-9a-fA-F]{64}$' -or $env:CANDIDATE_EXE_SHA256 -notmatch '^[0-9a-fA-F]{64}$' -or [string]::IsNullOrWhiteSpace($env:CANDIDATE_REF)) { throw 'Full candidate provenance fields are required' }
          $run = gh api "repos/henryliuwork/SiteIndex/actions/runs/$env:CANDIDATE_RUN_ID" | ConvertFrom-Json
          $artifact = gh api "repos/henryliuwork/SiteIndex/actions/artifacts/$env:CANDIDATE_ARTIFACT_ID" | ConvertFrom-Json
          if ($run.head_sha -ine $env:CANDIDATE_COMMIT -or $run.head_branch -ne $env:CANDIDATE_REF -or $run.event -ne 'workflow_dispatch' -or $run.workflow_id -ne 392411878 -or $run.status -ne 'completed' -or $run.conclusion -ne 'success') { throw 'Candidate release run provenance mismatch' }
          if ($artifact.name -ne 'siteindex-win' -or $artifact.workflow_run.id -ne [long]$env:CANDIDATE_RUN_ID -or $artifact.digest -ine "sha256:$env:CANDIDATE_ARCHIVE_SHA256") { throw 'Candidate artifact provenance mismatch' }
          $files = @(Get-ChildItem -LiteralPath pinned-candidate -Filter 'SiteIndex-Setup-*.exe' -File -Recurse)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'SiteIndex-Setup-0.9.0.exe') { throw 'Expected exactly one v0.9.0 candidate NSIS EXE' }
          if ((Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash -ine $env:CANDIDATE_EXE_SHA256) { throw 'Candidate EXE SHA256 mismatch' }
          $buildLog = gh run view $env:CANDIDATE_RUN_ID --repo henryliuwork/SiteIndex --log
          if ($LASTEXITCODE -ne 0 -or -not ($buildLog -match 'Windows installer check passed after two installs to a custom directory')) { throw 'Pinned candidate run lacks the real custom-directory double-install check' }
          $candidate = @{ file = $files[0].FullName; ref = $env:CANDIDATE_REF; commit = $env:CANDIDATE_COMMIT
            runId = [long]$env:CANDIDATE_RUN_ID; artifactId = [long]$env:CANDIDATE_ARTIFACT_ID; artifact = 'siteindex-win'
            sha256 = $env:CANDIDATE_EXE_SHA256; archiveSha256 = $env:CANDIDATE_ARCHIVE_SHA256
            kind = 'run-artifact'; workflowId = 392411878; event = 'workflow_dispatch' }
          $old = @{ file = (Resolve-Path pinned-baseline/SiteIndex-Setup-0.8.4.exe).Path; ref = 'v0.8.4'
            commit = 'fdf486f9e1a209f525783062c2644cd3401763e7'; runId = 45577171330; artifactId = 790734078
            artifact = 'SiteIndex-Setup-0.8.4.exe'; sha256 = '20b17cb1c3e6f813df93b8fda2ad6ab1aaa3fb6f31641dcd73df9d88c6a4d7d6'
            kind = 'release'; workflowId = 392411878; event = 'push' }
          $recent = @{ file = (Resolve-Path pinned-baseline/SiteIndex-Setup-0.8.5.exe).Path; ref = 'v0.8.5'
            commit = '302faf8921911bd31691f9cbd3f854bd2e45a5a9'; runId = 45920066827; artifactId = 798378691
            artifact = 'SiteIndex-Setup-0.8.5.exe'; sha256 = '48c6b56d8388a3602a648615fcbf16bd15cb8f14d3465de474f89b1f265a3b62'
            kind = 'release'; workflowId = 392411878; event = 'push' }
          @{ baseline = $old; candidate = $candidate } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath pinned-v085.json -Encoding utf8
          @{ baseline = $recent; candidate = $candidate } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath pinned-v090.json -Encoding utf8
          "Candidate run $env:CANDIDATE_RUN_ID at $env:CANDIDATE_COMMIT; artifact $env:CANDIDATE_ARTIFACT_ID ZIP SHA256 $env:CANDIDATE_ARCHIVE_SHA256; EXE SHA256 $env:CANDIDATE_EXE_SHA256; custom-directory double install passed." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Run legacy 1–83 against the same pinned candidate
        shell: pwsh
        run: |
          node packages/desktop/scripts/acceptance/run.mjs --matrix v085 --items 1-83 --baseline v0.8.4 --candidate $env:CANDIDATE_REF --manifest pinned-v085.json --output-dir siteindex-v090-legacy-results
          if ($LASTEXITCODE -ne 0) { throw 'Legacy 1–83 acceptance failed; inspect its report' }
          $report = Get-Content -LiteralPath siteindex-v090-legacy-results/report.json -Raw | ConvertFrom-Json
          $harnessErrors = @($report.items | Where-Object status -eq 'harness_error').Count
          $completed = @($report.items | Where-Object { $_.phase -eq 'upgrade-readback' -and $_.status -eq 'passed' }).Count
          if ($harnessErrors -ne 0 -or $report.cleanup.status -ne 'passed' -or $completed -ne 83) { throw 'Legacy 1–83 report lacks full pass, zero harness errors or cleanup' }
          "Legacy 1–83: $completed passed; harness_error=$harnessErrors; cleanup=$($report.cleanup.status)." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Run new 84–86 against the same pinned candidate
        shell: pwsh
        run: |
          node packages/desktop/scripts/acceptance/run.mjs --matrix v090 --items 84-86 --baseline v0.8.5 --candidate $env:CANDIDATE_REF --manifest pinned-v090.json --output-dir siteindex-v090-new-results
          if ($LASTEXITCODE -ne 0) { throw 'New 84–86 acceptance failed; inspect its report' }
          $report = Get-Content -LiteralPath siteindex-v090-new-results/report.json -Raw | ConvertFrom-Json
          $harnessErrors = @($report.items | Where-Object status -eq 'harness_error').Count
          $completed = @($report.items | Where-Object { $_.phase -eq 'upgrade-readback' -and $_.status -eq 'passed' }).Count
          if ($harnessErrors -ne 0 -or $report.cleanup.status -ne 'passed' -or $completed -ne 3) { throw 'New 84–86 report lacks full pass, zero harness errors or cleanup' }
          "New 84–86: $completed passed; harness_error=$harnessErrors; cleanup=$($report.cleanup.status); fonts and --run-job recorded in row 84." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Upload synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siteindex-v090-acceptance-${{ github.run_id }}
          path: |
            siteindex-v090-legacy-results/
            siteindex-v090-new-results/
          if-no-files-found: warn
