name: E · Windows #82 vault restart diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/e-windows-v082-vault-restart-diagnostic.yml"
      - "packages/desktop/scripts/e-windows-v082-vault-restart-diagnostic.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-official-packages:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download official v0.7.6 and v0.8.0 NSIS installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.7.6 --repo henryliuwork/SiteIndex --pattern SiteIndex-Setup-0.7.6.exe --dir installer-076
          gh release download v0.8.0 --repo henryliuwork/SiteIndex --pattern SiteIndex-Setup-0.8.0.exe --dir installer-080
      - name: Diagnose #82 UI vault status across full process restart
        env:
          SITEINDEX_RUNNER_ENVIRONMENT: github-hosted
        run: node packages/desktop/scripts/e-windows-v082-vault-restart-diagnostic.mjs installer-076/SiteIndex-Setup-0.7.6.exe installer-080/SiteIndex-Setup-0.8.0.exe
      - name: Publish diagnostic summary
        if: always()
        shell: pwsh
        run: |
          $path = 'siteindex-v082-vault-diagnostic-results/summary.json'
          if (Test-Path -LiteralPath $path) {
            $report = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '## #794 synthetic WordPress vault restart diagnostic'
            foreach ($row in $report.versions) {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- v$($row.version): $($row.outcome); same=$($row.sameSessionStatus); restart=$($row.restartedStatus); vault file=$($row.vaultAfterRestart.exists)"
            }
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Diagnostic result only; no candidate package or real credentials were used.'
          }
      - name: Upload synthetic-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siteindex-v082-vault-restart-diagnostic
          path: siteindex-v082-vault-diagnostic-results/
          if-no-files-found: warn
