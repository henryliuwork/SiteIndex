name: CI

# 仓库已公开，GitHub 托管 runner 不计分钟：每个 PR 与 main 都跑三个系统。
# 不使用 paths-ignore：main 的 ruleset 要求这三个检查，跳过会导致 PR 无法合并。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - if: matrix.os == 'windows-latest'
        run: pnpm --filter @siteindex/desktop build
