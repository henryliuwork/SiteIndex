name: CI

# 私有仓库 Actions 按分钟计费：Linux ×1、Windows ×2、macOS ×10。
# PR 只跑 Linux；合并到 main 时加跑 Windows（主平台）；macOS 只在 Release 打包时跑。
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "design/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "design/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - if: matrix.os == 'windows-latest'
        run: pnpm --filter @siteindex/desktop build
