name: CI

# 每个 PR 与 main 只跑 Windows 和 macOS。
# 不使用 paths-ignore：main 的 ruleset 要求这两个检查，跳过会导致 PR 无法合并。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - if: matrix.os == 'macos-latest'
        run: pnpm --filter @siteindex/ui build
      - if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./packages/desktop/test/candidate-run-source.test.ps1
      - name: Scan public skills and templates (warning only)
        run: node packages/desktop/scripts/security-scan.mjs
      - if: matrix.os == 'windows-latest'
        run: pnpm --filter @siteindex/desktop build
