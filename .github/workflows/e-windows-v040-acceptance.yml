name: E · Windows packaged acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/e-windows-v040-acceptance.yml"
      - "packages/desktop/scripts/e-windows-v040-acceptance.mjs"
      - "packages/desktop/scripts/credential-region-wait.mjs"
      - "packages/desktop/scripts/e-windows-profile-isolation.mjs"
      - "packages/desktop/scripts/e-windows-v041-reconnect.mjs"
      - "packages/desktop/scripts/e-windows-v041-credential-oracle.mjs"
      - "packages/desktop/scripts/e-windows-v040-synthetic-fixture.mjs"
      - "packages/desktop/scripts/windows-appdata-redirect.mjs"
      - "packages/desktop/scripts/check-candidate-run.ps1"
      - "packages/desktop/test/e-windows-v040-synthetic-fixture.test.ts"
      - "packages/desktop/test/credential-region-wait.test.ts"
      - "packages/desktop/test/e-windows-profile-isolation.test.ts"
      - "packages/desktop/test/e-windows-v041-hosted-update.test.ts"
      - "packages/desktop/test/e-windows-v041-hosted-oracle.test.ts"
      - "packages/desktop/test/windows-appdata-redirect.test.ts"
      - "packages/desktop/test/candidate-run-source.test.ps1"
      - "packages/desktop/src/preload/index.ts"
      - "packages/desktop/src/preload/window-api.ts"
      - "packages/desktop/src/preload/window-api.test.ts"
      - "packages/desktop/src/main/index.ts"
      - "packages/desktop/src/main/profile-path-diagnostic.ts"
      - "packages/desktop/src/main/profile-path-diagnostic.test.ts"
      - "packages/ui/visual/wordpress-credentials-smoke.mjs"
      - "fixtures/e-v041-loopback/credential-isolation-report-oracle.mjs"
  workflow_dispatch:
    inputs:
      expected_source_commit:
        description: "验收脚本 checkout commit SHA；用于冻结本轮验收代码"
        required: false
        type: string
      baseline_version:
        description: "已发布的旧版本；v0.4.1 托管更新验收使用 0.4.0"
        required: false
        default: "0.4.0"
        type: string
      baseline_tag_commit:
        description: "旧版本 tag 指向的完整 commit SHA"
        required: false
        default: "334d5bee76156ad856986031020f51b2bcb7319d"
        type: string
      baseline_asset_id:
        description: "旧版本 SiteIndex-Setup EXE 的 GitHub Release asset ID"
        required: false
        default: "734250277"
        type: string
      baseline_asset_sha256:
        description: "旧版本 EXE 的 SHA256"
        required: false
        default: "a7414e062a18170ef00f3bb7e09d11cb2b81d2197baff8717b7ee4a9ddda2b90"
        type: string
      candidate_version:
        description: "候选安装包版本；v0.4.1 验收默认值"
        required: false
        default: "0.4.1"
        type: string
      hosted_update:
        description: "使用 GitHub Releases 自动更新从 baseline 升级到已发布候选版本"
        required: false
        default: true
        type: boolean
      candidate_release_commit:
        description: "候选版本 tag 指向的完整 commit SHA（hosted_update 必填）"
        required: false
        type: string
      candidate_release_asset_id:
        description: "候选 EXE 的 GitHub Release asset ID（hosted_update 必填）"
        required: false
        type: string
      candidate_release_asset_sha256:
        description: "候选 EXE 的 GitHub SHA256 digest（hosted_update 必填）"
        required: false
        type: string
      candidate_installer_url:
        description: "可选：候选 Windows 安装包 HTTPS 地址；与 artifact run 模式互斥"
        required: false
        type: string
      candidate_installer_sha256:
        description: "提供候选安装包 URL 时必须填写 EXE SHA256"
        required: false
        type: string
      candidate_workflow_run_id:
        description: "可选：上传候选 artifact 的 Release workflow run ID"
        required: false
        type: string
      candidate_artifact_id:
        description: "可选：Windows siteindex-win artifact ID"
        required: false
        type: string
      candidate_artifact_sha256:
        description: "候选 artifact ZIP 的 GitHub SHA256 digest"
        required: false
        type: string
      candidate_source_commit:
        description: "候选包 Release workflow 的完整 head commit SHA"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: e-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-packaged-acceptance:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Record Windows build
        shell: pwsh
        env:
          EXPECTED_SOURCE_COMMIT_INPUT: ${{ inputs.expected_source_commit }}
          BASELINE_VERSION_INPUT: ${{ inputs.baseline_version }}
          BASELINE_TAG_COMMIT_INPUT: ${{ inputs.baseline_tag_commit }}
          BASELINE_ASSET_ID_INPUT: ${{ inputs.baseline_asset_id }}
          BASELINE_ASSET_SHA256_INPUT: ${{ inputs.baseline_asset_sha256 }}
          CANDIDATE_VERSION_INPUT: ${{ inputs.candidate_version }}
          HOSTED_UPDATE_INPUT: ${{ inputs.hosted_update }}
          CANDIDATE_RELEASE_COMMIT_INPUT: ${{ inputs.candidate_release_commit }}
          CANDIDATE_RELEASE_ASSET_ID_INPUT: ${{ inputs.candidate_release_asset_id }}
          CANDIDATE_RELEASE_ASSET_SHA256_INPUT: ${{ inputs.candidate_release_asset_sha256 }}
          CANDIDATE_SHA256_INPUT: ${{ inputs.candidate_installer_sha256 }}
          CANDIDATE_URL_INPUT: ${{ inputs.candidate_installer_url }}
          CANDIDATE_RUN_ID_INPUT: ${{ inputs.candidate_workflow_run_id }}
          CANDIDATE_ARTIFACT_ID_INPUT: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_SHA256_INPUT: ${{ inputs.candidate_artifact_sha256 }}
          CANDIDATE_SOURCE_COMMIT_INPUT: ${{ inputs.candidate_source_commit }}
          PR_HEAD_SHA_INPUT: ${{ github.event.pull_request.head.sha }}
        run: |
          $rawInputs = @(
            $env:EXPECTED_SOURCE_COMMIT_INPUT,
            $env:BASELINE_VERSION_INPUT,
            $env:BASELINE_TAG_COMMIT_INPUT,
            $env:BASELINE_ASSET_ID_INPUT,
            $env:BASELINE_ASSET_SHA256_INPUT,
            $env:CANDIDATE_VERSION_INPUT,
            $env:HOSTED_UPDATE_INPUT,
            $env:CANDIDATE_RELEASE_COMMIT_INPUT,
            $env:CANDIDATE_RELEASE_ASSET_ID_INPUT,
            $env:CANDIDATE_RELEASE_ASSET_SHA256_INPUT,
            $env:CANDIDATE_SHA256_INPUT,
            $env:CANDIDATE_URL_INPUT,
            $env:CANDIDATE_RUN_ID_INPUT,
            $env:CANDIDATE_ARTIFACT_ID_INPUT,
            $env:CANDIDATE_ARTIFACT_SHA256_INPUT,
            $env:CANDIDATE_SOURCE_COMMIT_INPUT
          )
          foreach ($value in $rawInputs) {
            if ($value -match '[\r\n]') { throw "Workflow inputs must be single-line values." }
          }
          $sourceCommit = $env:EXPECTED_SOURCE_COMMIT_INPUT.Trim()
          $baselineVersion = $env:BASELINE_VERSION_INPUT.Trim()
          if (-not $baselineVersion) { $baselineVersion = "0.4.0" }
          $baselineTagCommit = $env:BASELINE_TAG_COMMIT_INPUT.Trim().ToLowerInvariant()
          if (-not $baselineTagCommit) { $baselineTagCommit = "334d5bee76156ad856986031020f51b2bcb7319d" }
          $baselineAssetId = $env:BASELINE_ASSET_ID_INPUT.Trim()
          if (-not $baselineAssetId) { $baselineAssetId = "734250277" }
          $baselineAssetSha256 = $env:BASELINE_ASSET_SHA256_INPUT.Trim().ToLowerInvariant()
          if (-not $baselineAssetSha256) { $baselineAssetSha256 = "a7414e062a18170ef00f3bb7e09d11cb2b81d2197baff8717b7ee4a9ddda2b90" }
          $candidateVersion = $env:CANDIDATE_VERSION_INPUT.Trim()
          if (-not $candidateVersion) { $candidateVersion = "0.4.1" }
          $hostedUpdate = $env:HOSTED_UPDATE_INPUT.Trim().ToLowerInvariant() -eq "true"
          $candidateReleaseCommit = $env:CANDIDATE_RELEASE_COMMIT_INPUT.Trim().ToLowerInvariant()
          $candidateReleaseAssetId = $env:CANDIDATE_RELEASE_ASSET_ID_INPUT.Trim()
          $candidateReleaseAssetSha256 = $env:CANDIDATE_RELEASE_ASSET_SHA256_INPUT.Trim().ToLowerInvariant()
          $candidateSha256 = $env:CANDIDATE_SHA256_INPUT.Trim()
          $candidateUrl = $env:CANDIDATE_URL_INPUT.Trim()
          $candidateRunId = $env:CANDIDATE_RUN_ID_INPUT.Trim()
          $candidateArtifactId = $env:CANDIDATE_ARTIFACT_ID_INPUT.Trim()
          $candidateArtifactSha256 = $env:CANDIDATE_ARTIFACT_SHA256_INPUT.Trim().ToLowerInvariant()
          $candidateSourceCommit = $env:CANDIDATE_SOURCE_COMMIT_INPUT.Trim().ToLowerInvariant()
          if ($sourceCommit -and $sourceCommit -notmatch '^[0-9a-fA-F]{40}$') {
            throw "The expected source commit must be a 40-character hexadecimal SHA."
          }
          if ($baselineVersion -notmatch '^\d+\.\d+\.\d+$') { throw "The baseline version must use three numeric components." }
          if ($baselineTagCommit -notmatch '^[0-9a-f]{40}$') { throw "The baseline tag commit must be a 40-character hexadecimal SHA." }
          if ($baselineAssetId -notmatch '^\d{1,20}$') { throw "The baseline Release asset ID must be numeric." }
          if ($baselineAssetSha256 -notmatch '^[0-9a-f]{64}$') { throw "The baseline EXE SHA256 must be a 64-character hexadecimal digest." }
          if ($candidateVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "The candidate version must use three numeric components."
          }
          if ([version]::Parse($candidateVersion) -le [version]::Parse($baselineVersion)) { throw "The candidate version must be newer than the baseline." }
          if ($candidateSha256 -and $candidateSha256 -notmatch '^[0-9a-fA-F]{64}$') {
            throw "The candidate installer SHA256 must be a 64-character hexadecimal digest."
          }
          if ($candidateUrl -and $candidateUrl -notmatch '^https://\S{1,2040}$') {
            throw "The candidate installer URL must be a single-line HTTPS URL."
          }
          $artifactMode = $candidateRunId -or $candidateArtifactId -or $candidateArtifactSha256 -or $candidateSourceCommit
          $candidateArtifactSource = if ($artifactMode) { "workflow-run-artifact" } elseif ($candidateUrl) { "candidate-installer-url" } else { "runner-built-internal-candidate" }
          if ($hostedUpdate) {
            if ($candidateUrl -or $artifactMode) { throw "Hosted update mode uses a published Release asset; do not also supply a URL or workflow artifact." }
            if (-not $sourceCommit) { throw "Hosted update mode requires the frozen acceptance-code commit." }
            if ($candidateReleaseCommit -notmatch '^[0-9a-f]{40}$') { throw "Hosted update mode requires the candidate tag commit SHA." }
            if ($candidateReleaseAssetId -notmatch '^\d{1,20}$') { throw "Hosted update mode requires the candidate Release asset ID." }
            if ($candidateReleaseAssetSha256 -notmatch '^[0-9a-f]{64}$') { throw "Hosted update mode requires the candidate EXE SHA256." }
            $candidateArtifactSource = "published-hosted-release"
          } elseif ($candidateReleaseCommit -or $candidateReleaseAssetId -or $candidateReleaseAssetSha256) {
            throw "Candidate Release provenance inputs require hosted_update=true."
          }
          if ($candidateUrl -and $artifactMode) {
            throw "Use either a candidate installer URL or a workflow-run artifact, not both."
          }
          if ($candidateUrl -and (-not $candidateSha256 -or -not $sourceCommit)) {
            throw "A supplied candidate installer URL requires its EXE SHA256 and frozen acceptance-code commit."
          }
          if ($artifactMode) {
            if (-not $sourceCommit) { throw "A workflow-run artifact requires the frozen acceptance-code commit." }
            if (-not $candidateRunId -or $candidateRunId -notmatch '^\d{1,20}$') { throw "A workflow-run artifact requires a numeric source run ID." }
            if (-not $candidateArtifactId -or $candidateArtifactId -notmatch '^\d{1,20}$') { throw "A workflow-run artifact requires a numeric artifact ID." }
            if ($candidateArtifactSha256 -notmatch '^[0-9a-f]{64}$') { throw "A workflow-run artifact requires its 64-character SHA256 digest." }
            if ($candidateSourceCommit -notmatch '^[0-9a-f]{40}$') { throw "A workflow-run artifact requires its 40-character source commit SHA." }
            if ($candidateSha256) { throw "Do not supply candidate_installer_sha256 in workflow-run artifact mode; the artifact digest and EXE hash are recorded separately." }
          } elseif ($candidateSha256 -and -not $candidateUrl) {
            throw "A candidate installer SHA256 requires a candidate installer URL."
          }
          $os = Get-CimInstance Win32_OperatingSystem
          "SITEINDEX_WINDOWS_VERSION=$($os.Version)" >> $env:GITHUB_ENV
          "SITEINDEX_WINDOWS_BUILD=$($os.BuildNumber)" >> $env:GITHUB_ENV
          "SITEINDEX_RUNNER_IMAGE=$($env:ImageOS)/$($env:ImageVersion)" >> $env:GITHUB_ENV
          "SITEINDEX_PR_HEAD_SHA=$($env:PR_HEAD_SHA_INPUT)" >> $env:GITHUB_ENV
          "SITEINDEX_EXPECTED_SOURCE_COMMIT=$sourceCommit" >> $env:GITHUB_ENV
          "SITEINDEX_BASELINE_VERSION=$baselineVersion" >> $env:GITHUB_ENV
          "SITEINDEX_BASELINE_TAG_COMMIT=$baselineTagCommit" >> $env:GITHUB_ENV
          "SITEINDEX_BASELINE_ASSET_ID=$baselineAssetId" >> $env:GITHUB_ENV
          "SITEINDEX_BASELINE_ASSET_SHA256=$baselineAssetSha256" >> $env:GITHUB_ENV
          "SITEINDEX_EXPECTED_CANDIDATE_SHA256=$candidateSha256" >> $env:GITHUB_ENV
          "SITEINDEX_CANDIDATE_VERSION=$candidateVersion" >> $env:GITHUB_ENV
          "SITEINDEX_HOSTED_UPDATE=$($hostedUpdate.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
          "SITEINDEX_CANDIDATE_RELEASE_COMMIT=$candidateReleaseCommit" >> $env:GITHUB_ENV
          "SITEINDEX_CANDIDATE_RELEASE_ASSET_ID=$candidateReleaseAssetId" >> $env:GITHUB_ENV
          "SITEINDEX_CANDIDATE_RELEASE_ASSET_SHA256=$candidateReleaseAssetSha256" >> $env:GITHUB_ENV
          "SITEINDEX_CANDIDATE_ARTIFACT_SOURCE=$candidateArtifactSource" >> $env:GITHUB_ENV
          "SITEINDEX_CANDIDATE_WORKFLOW_RUN_ID=$candidateRunId" >> $env:GITHUB_ENV
          "SITEINDEX_CANDIDATE_ARTIFACT_ID=$candidateArtifactId" >> $env:GITHUB_ENV
          "SITEINDEX_EXPECTED_CANDIDATE_ARTIFACT_SHA256=$candidateArtifactSha256" >> $env:GITHUB_ENV
          "SITEINDEX_EXPECTED_CANDIDATE_SOURCE_COMMIT=$candidateSourceCommit" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path (Join-Path $PWD "siteindex-e-windows-results") -Force | Out-Null
          Write-Output "Windows build recorded: $($os.Version) build $($os.BuildNumber)"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set runner-only candidate version
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.candidate_installer_url == '' && inputs.candidate_workflow_run_id == '' && !inputs.hosted_update) }}
        shell: pwsh
        run: |
          $packagePath = Join-Path $PWD "packages/desktop/package.json"
          $source = [System.IO.File]::ReadAllText($packagePath)
          $versionMatch = [regex]::Match($source, '(?m)^\s*"version"\s*:\s*"([^"]+)"')
          $version = $versionMatch.Groups[1].Value
          $candidateVersion = $env:SITEINDEX_CANDIDATE_VERSION
          if (-not $versionMatch.Success) { throw "Could not read Desktop package version." }
          if ($version -ne $candidateVersion) {
            $candidate = $source.Replace($versionMatch.Value, $versionMatch.Value.Replace('"' + $version + '"', '"' + $candidateVersion + '"'))
            if ($candidate -eq $source) { throw "Could not apply the runner-only version override." }
            [System.IO.File]::WriteAllText($packagePath, $candidate, [System.Text.UTF8Encoding]::new($false))
            Write-Output "Runner checkout will package app version $candidateVersion; repository manifest is unchanged."
          }
      - name: Build candidate Windows installer
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.candidate_installer_url == '' && inputs.candidate_workflow_run_id == '' && !inputs.hosted_update) }}
        run: pnpm --filter @siteindex/desktop dist:win
      - name: Download and verify supplied official candidate installer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_installer_url != '' }}
        shell: pwsh
        env:
          CANDIDATE_URL: ${{ inputs.candidate_installer_url }}
          EXPECTED_SHA256: ${{ inputs.candidate_installer_sha256 }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CANDIDATE_URL) -or [string]::IsNullOrWhiteSpace($env:EXPECTED_SHA256)) {
            throw "A candidate installer URL and SHA256 are both required."
          }
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_SOURCE_COMMIT)) {
            throw "The frozen source commit is required when testing a supplied candidate installer."
          }
          $candidateVersion = $env:SITEINDEX_CANDIDATE_VERSION
          $installer = Join-Path $env:RUNNER_TEMP "SiteIndex-Setup-$candidateVersion.exe"
          Invoke-WebRequest -Uri $env:CANDIDATE_URL -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256.ToLowerInvariant()) { throw "Candidate installer SHA256 does not match the supplied digest." }
          "SITEINDEX_CANDIDATE_INSTALLER_SHA256=$actual" >> $env:GITHUB_ENV
          Write-Output "Supplied official candidate installer SHA256 verified."
      - name: Verify candidate workflow run and artifact provenance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_workflow_run_id != '' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $apiRoot = $env:GITHUB_API_URL.TrimEnd('/')
          $repo = $env:GITHUB_REPOSITORY
          $runId = [long]$env:SITEINDEX_CANDIDATE_WORKFLOW_RUN_ID
          $artifactId = [long]$env:SITEINDEX_CANDIDATE_ARTIFACT_ID
          $expectedSource = $env:SITEINDEX_EXPECTED_CANDIDATE_SOURCE_COMMIT
          $expectedDigest = $env:SITEINDEX_EXPECTED_CANDIDATE_ARTIFACT_SHA256
          $version = $env:SITEINDEX_CANDIDATE_VERSION

          $releaseWorkflow = Invoke-RestMethod -Method Get -Uri "$apiRoot/repos/$repo/actions/workflows/release.yml" -Headers $headers
          $sourceRun = Invoke-RestMethod -Method Get -Uri "$apiRoot/repos/$repo/actions/runs/$runId" -Headers $headers
          $artifact = Invoke-RestMethod -Method Get -Uri "$apiRoot/repos/$repo/actions/artifacts/$artifactId" -Headers $headers
          $actualDigest = ([string]$artifact.digest -replace '^sha256:', '').ToLowerInvariant()

          if ($sourceRun.workflow_id -ne $releaseWorkflow.id) { throw "Candidate run did not use the repository Release workflow." }
          $tagRef = $null
          $tagCommit = ''
          if ($sourceRun.event -ceq 'push' -and $sourceRun.head_branch -ceq "v$version") {
            $tagRef = Invoke-RestMethod -Method Get -Uri "$apiRoot/repos/$repo/git/ref/tags/v$version" -Headers $headers
            $tagObject = $tagRef.object
            for ($depth = 0; $tagObject.type -eq 'tag' -and $depth -lt 5; $depth++) {
              $tagObject = (Invoke-RestMethod -Method Get -Uri "$apiRoot/repos/$repo/git/tags/$($tagObject.sha)" -Headers $headers).object
            }
            if ($tagObject.type -ne 'commit') { throw 'Candidate version tag must resolve to a commit.' }
            $tagCommit = [string]$tagObject.sha
          }
          . ./packages/desktop/scripts/check-candidate-run.ps1
          Assert-CandidateRunSource -Run $sourceRun -Version $version -ExpectedSource $expectedSource -TagRef $tagRef -TagCommit $tagCommit
          if ($artifact.id -ne $artifactId -or $artifact.name -ne "siteindex-win" -or $artifact.expired) { throw "The supplied artifact is not a live siteindex-win artifact." }
          if ($artifact.workflow_run.id -ne $runId -or $artifact.workflow_run.head_sha -ne $expectedSource) { throw "Artifact provenance does not match the supplied run and source commit." }
          if ($actualDigest -ne $expectedDigest) { throw "GitHub artifact SHA256 digest does not match the supplied digest." }

          "SITEINDEX_CANDIDATE_ARTIFACT_SOURCE=workflow-run-artifact" >> $env:GITHUB_ENV
          "SITEINDEX_CANDIDATE_ARTIFACT_RUN_ID=$runId" >> $env:GITHUB_ENV
          "SITEINDEX_CANDIDATE_ARTIFACT_ID=$artifactId" >> $env:GITHUB_ENV
          "SITEINDEX_CANDIDATE_ARTIFACT_NAME=$($artifact.name)" >> $env:GITHUB_ENV
          "SITEINDEX_CANDIDATE_ARTIFACT_SHA256=$actualDigest" >> $env:GITHUB_ENV
          "SITEINDEX_CANDIDATE_SOURCE_COMMIT=$($sourceRun.head_sha)" >> $env:GITHUB_ENV
          Write-Output "Verified Release run $runId, artifact $artifactId, source $expectedSource, artifact SHA256 $actualDigest."
      - name: Download exact candidate artifact from workflow run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_workflow_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_workflow_run_id }}
          path: siteindex-candidate-artifact
          digest-mismatch: error
      - name: Verify candidate EXE from original artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_workflow_run_id != '' }}
        shell: pwsh
        run: |
          $candidateVersion = $env:SITEINDEX_CANDIDATE_VERSION
          $artifactDirectory = Join-Path $PWD "siteindex-candidate-artifact"
          $installerName = "SiteIndex-Setup-$candidateVersion.exe"
          $installer = Join-Path $artifactDirectory $installerName
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Candidate artifact is missing the expected installer filename." }
          $installers = @(Get-ChildItem -LiteralPath $artifactDirectory -Filter "SiteIndex-Setup-*.exe" -File -Recurse)
          if ($installers.Count -ne 1 -or $installers[0].FullName -ne $installer) { throw "Candidate artifact must contain exactly one installer for the requested version." }
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "SITEINDEX_CANDIDATE_INSTALLER_SHA256=$actual" >> $env:GITHUB_ENV
          Write-Output "Verified original artifact EXE $installerName SHA256 $actual."
      - name: Verify and download pinned baseline Release installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $apiRoot = $env:GITHUB_API_URL.TrimEnd('/')
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{ Accept = "application/vnd.github+json"; Authorization = "Bearer $env:GH_TOKEN"; "X-GitHub-Api-Version" = "2022-11-28" }
          $version = $env:SITEINDEX_BASELINE_VERSION
          $tag = "v$version"
          $expectedCommit = $env:SITEINDEX_BASELINE_TAG_COMMIT
          $expectedAssetId = [long]$env:SITEINDEX_BASELINE_ASSET_ID
          $expectedDigest = $env:SITEINDEX_BASELINE_ASSET_SHA256
          $release = Invoke-RestMethod -Method Get -Uri "$apiRoot/repos/$repo/releases/tags/$tag" -Headers $headers
          if ($release.draft -or $release.prerelease -or $release.tag_name -cne $tag) { throw "Baseline Release must be a published stable version." }
          $tagRef = Invoke-RestMethod -Method Get -Uri "$apiRoot/repos/$repo/git/ref/tags/$tag" -Headers $headers
          $tagObject = $tagRef.object
          for ($depth = 0; $tagObject.type -eq 'tag' -and $depth -lt 5; $depth++) {
            $tagObject = (Invoke-RestMethod -Method Get -Uri "$apiRoot/repos/$repo/git/tags/$($tagObject.sha)" -Headers $headers).object
          }
          if ($tagObject.type -ne 'commit' -or $tagObject.sha -cne $expectedCommit) { throw "Baseline version tag does not resolve to the pinned source commit." }
          $assetName = "SiteIndex-Setup-$version.exe"
          $asset = @($release.assets | Where-Object { $_.name -ceq $assetName }) | Select-Object -First 1
          $releaseDigest = ([string]$asset.digest -replace '^sha256:', '').ToLowerInvariant()
          if (-not $asset -or $asset.id -ne $expectedAssetId -or $releaseDigest -cne $expectedDigest) { throw "Baseline installer asset ID or SHA256 differs from the pinned release metadata." }
          $installer = Join-Path $env:RUNNER_TEMP $assetName
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expectedDigest) { throw "Downloaded baseline installer SHA256 does not match the pinned GitHub digest." }
          "SITEINDEX_BASE_INSTALLER_SHA256=$actual" >> $env:GITHUB_ENV
          Write-Output "Baseline v$version release tag, asset ID, GitHub digest, and downloaded EXE SHA256 verified."
      - name: Verify and download published hosted-update candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.hosted_update }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $apiRoot = $env:GITHUB_API_URL.TrimEnd('/')
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{ Accept = "application/vnd.github+json"; Authorization = "Bearer $env:GH_TOKEN"; "X-GitHub-Api-Version" = "2022-11-28" }
          $version = $env:SITEINDEX_CANDIDATE_VERSION
          $tag = "v$version"
          $expectedCommit = $env:SITEINDEX_CANDIDATE_RELEASE_COMMIT
          $expectedAssetId = [long]$env:SITEINDEX_CANDIDATE_RELEASE_ASSET_ID
          $expectedDigest = $env:SITEINDEX_CANDIDATE_RELEASE_ASSET_SHA256
          $release = Invoke-RestMethod -Method Get -Uri "$apiRoot/repos/$repo/releases/tags/$tag" -Headers $headers
          if ($release.draft -or $release.prerelease -or $release.tag_name -cne $tag) { throw "Candidate Release must be a published stable version." }
          $latest = Invoke-RestMethod -Method Get -Uri "$apiRoot/repos/$repo/releases/latest" -Headers $headers
          if ($latest.tag_name -cne $tag) { throw "Candidate Release is not GitHub's latest stable Release; electron-updater would not offer it." }
          $tagRef = Invoke-RestMethod -Method Get -Uri "$apiRoot/repos/$repo/git/ref/tags/$tag" -Headers $headers
          $tagObject = $tagRef.object
          for ($depth = 0; $tagObject.type -eq 'tag' -and $depth -lt 5; $depth++) {
            $tagObject = (Invoke-RestMethod -Method Get -Uri "$apiRoot/repos/$repo/git/tags/$($tagObject.sha)" -Headers $headers).object
          }
          if ($tagObject.type -ne 'commit' -or $tagObject.sha -cne $expectedCommit) { throw "Candidate version tag does not resolve to the supplied source commit." }
          $releaseWorkflow = Invoke-RestMethod -Method Get -Uri "$apiRoot/repos/$repo/actions/workflows/release.yml" -Headers $headers
          $workflowRuns = Invoke-RestMethod -Method Get -Uri "$apiRoot/repos/$repo/actions/workflows/$($releaseWorkflow.id)/runs?event=push&head_sha=$expectedCommit&per_page=100" -Headers $headers
          $releaseRun = @($workflowRuns.workflow_runs | Where-Object {
            $_.head_branch -ceq $tag -and $_.head_sha -ceq $expectedCommit -and $_.status -ceq "completed" -and $_.conclusion -ceq "success"
          } | Sort-Object -Property run_number -Descending | Select-Object -First 1)
          if ($releaseRun.Count -ne 1) { throw "No successful tag-triggered Release workflow run is bound to the candidate commit." }
          $releaseJobs = Invoke-RestMethod -Method Get -Uri "$apiRoot/repos/$repo/actions/runs/$($releaseRun[0].id)/jobs?per_page=100" -Headers $headers
          $windowsPackageJob = @($releaseJobs.jobs | Where-Object { $_.name -ceq "package (windows-latest, win)" -and $_.conclusion -ceq "success" })
          $assetVerificationJob = @($releaseJobs.jobs | Where-Object { $_.name -ceq "verify-release-assets" -and $_.conclusion -ceq "success" })
          if ($windowsPackageJob.Count -ne 1 -or $assetVerificationJob.Count -ne 1) { throw "The candidate Release run did not pass Windows packaging and asset verification." }
          $runArtifacts = Invoke-RestMethod -Method Get -Uri "$apiRoot/repos/$repo/actions/runs/$($releaseRun[0].id)/artifacts?per_page=100" -Headers $headers
          $buildArtifact = @($runArtifacts.artifacts | Where-Object { $_.name -ceq "siteindex-win" -and -not $_.expired }) | Select-Object -First 1
          if (-not $buildArtifact) { throw "The successful Release run has no retained siteindex-win build artifact." }
          if ($buildArtifact.workflow_run.id -ne $releaseRun[0].id -or $buildArtifact.workflow_run.head_sha -cne $expectedCommit) { throw "The Windows build artifact does not match the candidate Release run commit." }
          $buildArtifactDigest = ([string]$buildArtifact.digest -replace '^sha256:', '').ToLowerInvariant()
          $assetName = "SiteIndex-Setup-$version.exe"
          $asset = @($release.assets | Where-Object { $_.name -ceq $assetName }) | Select-Object -First 1
          $releaseDigest = ([string]$asset.digest -replace '^sha256:', '').ToLowerInvariant()
          if (-not $asset -or $asset.id -ne $expectedAssetId -or $releaseDigest -cne $expectedDigest) { throw "Candidate installer asset ID or SHA256 differs from the supplied release metadata." }
          $feedAsset = @($release.assets | Where-Object { $_.name -ceq "latest.yml" }) | Select-Object -First 1
          if (-not $feedAsset) { throw "Candidate Release is missing latest.yml; hosted updates cannot be checked." }
          $feedText = [string](Invoke-WebRequest -Uri $feedAsset.browser_download_url).Content
          $escapedVersion = [regex]::Escape($version)
          $escapedAssetName = [regex]::Escape($assetName)
          if ($feedText -notmatch "(?m)^version:\s*$escapedVersion\s*$") { throw "latest.yml version does not match the candidate Release." }
          if ($feedText -notmatch "(?m)^\s*url:\s*$escapedAssetName\s*$") { throw "latest.yml does not reference the verified candidate installer filename." }
          $feedSha512Match = [regex]::Match($feedText, "(?m)^\s+sha512:\s*(\S+)\s*$")
          if (-not $feedSha512Match.Success) { throw "latest.yml is missing the candidate installer SHA512." }
          $installer = Join-Path $env:RUNNER_TEMP $assetName
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expectedDigest) { throw "Downloaded candidate EXE SHA256 does not match the pinned GitHub digest." }
          $actualSha512 = [Convert]::ToBase64String([System.Security.Cryptography.SHA512]::HashData([System.IO.File]::ReadAllBytes($installer)))
          if ($actualSha512 -cne $feedSha512Match.Groups[1].Value) { throw "latest.yml SHA512 does not match the downloaded candidate installer." }
          "SITEINDEX_CANDIDATE_INSTALLER_SHA256=$actual" >> $env:GITHUB_ENV
          "SITEINDEX_CANDIDATE_SOURCE_COMMIT=$($tagObject.sha)" >> $env:GITHUB_ENV
          "SITEINDEX_CANDIDATE_RELEASE_RUN_ID=$($releaseRun[0].id)" >> $env:GITHUB_ENV
          "SITEINDEX_CANDIDATE_RELEASE_ARTIFACT_ID=$($buildArtifact.id)" >> $env:GITHUB_ENV
          "SITEINDEX_CANDIDATE_RELEASE_ARTIFACT_SHA256=$buildArtifactDigest" >> $env:GITHUB_ENV
          "SITEINDEX_CANDIDATE_UPDATE_METADATA_VERIFIED=true" >> $env:GITHUB_ENV
          Write-Output "Bound v$version to successful Release run $($releaseRun[0].id), Windows build artifact $($buildArtifact.id), tag commit, Release asset ID/digest, and latest.yml metadata."
      - name: Download exact Windows artifact from the candidate Release run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.hosted_update }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ env.SITEINDEX_CANDIDATE_RELEASE_ARTIFACT_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SITEINDEX_CANDIDATE_RELEASE_RUN_ID }}
          path: ${{ runner.temp }}/siteindex-candidate-release-build
          digest-mismatch: error
      - name: Compare Release asset with its source workflow artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.hosted_update }}
        shell: pwsh
        run: |
          $version = $env:SITEINDEX_CANDIDATE_VERSION
          $artifactPath = Join-Path $env:RUNNER_TEMP "siteindex-candidate-release-build/SiteIndex-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $artifactPath -PathType Leaf)) { throw "The verified siteindex-win artifact does not contain the expected candidate installer." }
          $artifactExeSha256 = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($artifactExeSha256 -cne $env:SITEINDEX_CANDIDATE_RELEASE_ASSET_SHA256) { throw "The published Release EXE differs from the installer in its successful Release workflow artifact." }
          "SITEINDEX_CANDIDATE_RELEASE_ARTIFACT_EXE_SHA256=$artifactExeSha256" >> $env:GITHUB_ENV
          Write-Output "Release EXE SHA256 matches the installer from the successful tag-triggered Windows packaging artifact."
      - name: Install, upgrade, and exercise packaged IPC
        shell: pwsh
        env:
          SITEINDEX_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $baselineVersion = $env:SITEINDEX_BASELINE_VERSION
          $candidateVersion = $env:SITEINDEX_CANDIDATE_VERSION
          $oldInstaller = Join-Path $env:RUNNER_TEMP "SiteIndex-Setup-$baselineVersion.exe"
          if ($env:SITEINDEX_HOSTED_UPDATE -eq "true" -or $env:SITEINDEX_CANDIDATE_ARTIFACT_SOURCE -eq "candidate-installer-url") {
            $candidateInstaller = Join-Path $env:RUNNER_TEMP "SiteIndex-Setup-$candidateVersion.exe"
          } elseif ($env:SITEINDEX_CANDIDATE_ARTIFACT_SOURCE -eq "workflow-run-artifact") {
            $candidateInstaller = Join-Path (Join-Path $PWD "siteindex-candidate-artifact") "SiteIndex-Setup-$candidateVersion.exe"
          } else {
            $candidateInstaller = Join-Path $PWD "release/SiteIndex-Setup-$candidateVersion.exe"
          }
          $env:SITEINDEX_ACCEPTANCE_OUTPUT = Join-Path $PWD "siteindex-e-windows-results"
          node packages/desktop/scripts/e-windows-v040-acceptance.mjs $oldInstaller $candidateInstaller
      - name: Add acceptance summary to workflow
        if: always()
        shell: pwsh
        run: |
          $summary = Join-Path $PWD "siteindex-e-windows-results/summary.md"
          if (Test-Path -LiteralPath $summary) { Get-Content -LiteralPath $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY }
      - name: Upload synthetic-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siteindex-e-windows-acceptance
          path: siteindex-e-windows-results/
          if-no-files-found: warn
          retention-days: 14
