name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mac:
        description: "同时打包 macOS"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 tag 与 Desktop 版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: node packages/desktop/scripts/check-release-version.mjs "$GITHUB_REF_NAME"

  prepare-release:
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 创建草稿 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo henryliuwork/SiteIndex >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo henryliuwork/SiteIndex --draft --title "SiteIndex $GITHUB_REF_NAME" --generate-notes
          fi

  package:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include: ${{ (github.event_name == 'push' || inputs.mac) && fromJSON('[{"os":"windows-latest","target":"win"},{"os":"macos-latest","target":"mac"}]') || fromJSON('[{"os":"windows-latest","target":"win"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build UI
        run: pnpm --filter @siteindex/ui build
      - name: Build installers and update metadata
        run: pnpm --filter @siteindex/desktop dist:${{ matrix.target }}${{ startsWith(github.ref, 'refs/tags/v') && ':release' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: siteindex-${{ matrix.target }}
          path: |
            release/SiteIndex-*.exe
            release/SiteIndex-*.dmg
            release/SiteIndex-*.zip
            release/SiteIndex-*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 校验资产并发布正式 Release
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets="$(gh release view "$GITHUB_REF_NAME" --repo henryliuwork/SiteIndex --json assets --jq '.assets[].name')"
          for expected in "SiteIndex-Setup-${version}.exe" "SiteIndex-${version}-universal.dmg" "SiteIndex-${version}-universal.zip" latest.yml latest-mac.yml; do
            if ! printf '%s\n' "$assets" | grep -Fxq "$expected"; then
              echo "缺少 Release 资产：$expected" >&2
              exit 1
            fi
          done
          if ! printf '%s\n' "$assets" | grep -Eq '\.blockmap$'; then
            echo "缺少 Release .blockmap 资产" >&2
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --repo henryliuwork/SiteIndex --draft=false --prerelease=false
