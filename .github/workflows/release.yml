name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mac:
        description: "同时打包 macOS"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # 打 tag 时两个平台都打；手动运行可取消勾选 macOS 以加快速度
        include: ${{ (github.event_name == 'push' || inputs.mac) && fromJSON('[{"os":"windows-latest","target":"win"},{"os":"macos-latest","target":"mac"}]') || fromJSON('[{"os":"windows-latest","target":"win"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build UI with mock API
        run: pnpm --filter @siteindex/ui build
        env:
          VITE_MOCK: "1"
      - run: pnpm --filter @siteindex/desktop dist:${{ matrix.target }}
        env:
          VITE_MOCK: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: siteindex-${{ matrix.target }}
          path: |
            release/SiteIndex-*.exe
            release/SiteIndex-*.dmg
            release/SiteIndex-*.blockmap
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
