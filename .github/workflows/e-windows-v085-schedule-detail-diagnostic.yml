name: C · Windows schedule ErrorDetail one-shot diagnosis

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Fixed Release workflow_dispatch run ID
        required: true
        type: string
      source_sha:
        description: Full source commit SHA of the diagnostic installer
        required: true
        type: string
      artifact_id:
        description: Exact siteindex-win artifact ID
        required: true
        type: string
      exe_sha256:
        description: Exact installer SHA256
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      SITEINDEX_RUNNER_ENVIRONMENT: github-hosted
      SITEINDEX_DIAGNOSTIC_BUILD_RUN: ${{ inputs.build_run_id }}
      SITEINDEX_DIAGNOSTIC_SOURCE_SHA: ${{ inputs.source_sha }}
      SITEINDEX_DIAGNOSTIC_EXE_SHA256: ${{ inputs.exe_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify pinned build provenance
        shell: pwsh
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          if ($env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:SITEINDEX_DIAGNOSTIC_EXE_SHA256 -cnotmatch '^[0-9a-fA-F]{64}$') { throw 'Invalid fixed build identifiers.' }
          $repo = $env:GITHUB_REPOSITORY
          $run = gh api "repos/$repo/actions/runs/$env:BUILD_RUN_ID" | ConvertFrom-Json
          $workflow = gh api "repos/$repo/actions/workflows/release.yml" | ConvertFrom-Json
          $artifact = gh api "repos/$repo/actions/artifacts/$env:ARTIFACT_ID" | ConvertFrom-Json
          if ($run.workflow_id -ne $workflow.id -or $run.event -ne 'workflow_dispatch' -or $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.head_sha -cne $env:SOURCE_SHA) { throw 'Diagnostic installer source mismatch.' }
          if ($artifact.id -ne [long]$env:ARTIFACT_ID -or $artifact.name -cne 'siteindex-win' -or $artifact.expired -or $artifact.workflow_run.id -ne [long]$env:BUILD_RUN_ID -or $artifact.workflow_run.head_sha -cne $env:SOURCE_SHA) { throw 'Diagnostic installer artifact mismatch.' }
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: diagnostic-installer
          digest-mismatch: error
      - name: Run once with synthetic schedule and installed IPC
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem -LiteralPath diagnostic-installer -Filter 'SiteIndex-Setup-*.exe' -File -Recurse)
          if ($exe.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          node packages/desktop/scripts/e-windows-v085-schedule-detail-diagnostic.mjs $exe[0].FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siteindex-v085-schedule-detail-diagnostic
          path: siteindex-v085-schedule-diagnostic-results/
          if-no-files-found: warn
          retention-days: 14
