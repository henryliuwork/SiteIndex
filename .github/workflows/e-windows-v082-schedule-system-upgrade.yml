name: C · Windows v0.8.0 schedule #52 diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schedule-52-diagnostic:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify reviewed source and official v0.8.0 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          $source = (git rev-parse HEAD).Trim()
          if ($env:EXPECTED_SOURCE -cnotmatch '^[0-9a-f]{40}$' -or $source -cne $env:EXPECTED_SOURCE) { throw 'Diagnostic source differs from reviewed head.' }
          if ($env:GITHUB_REF -cne 'refs/heads/c/diag-v082-schedule52') { throw 'Diagnostic must run from its isolated branch.' }
          $repo = $env:GITHUB_REPOSITORY
          $release = gh api "repos/$repo/releases/tags/v0.8.0" | ConvertFrom-Json
          $tag = gh api "repos/$repo/git/ref/tags/v0.8.0" | ConvertFrom-Json
          $tagObject = $tag.object
          for ($depth = 0; $tagObject.type -eq 'tag' -and $depth -lt 5; $depth++) {
            $tagObject = (gh api "repos/$repo/git/tags/$($tagObject.sha)" | ConvertFrom-Json).object
          }
          $asset = @($release.assets | Where-Object name -eq 'SiteIndex-Setup-0.8.0.exe') | Select-Object -First 1
          $expectedSha = '65232832171b12d5362c6ec21e6dcb3a542149bbf2e9d1529eacacdf324d7e22'
          if ($release.draft -or $release.prerelease -or $tagObject.type -ne 'commit' -or $tagObject.sha -cne '47bf86878c80a96667d65e7b8b60229496ac995f') { throw 'Official v0.8.0 release/tag changed.' }
          if ($asset.id -ne 781732072 -or ([string]$asset.digest -replace '^sha256:', '').ToLowerInvariant() -cne $expectedSha) { throw 'Official baseline asset identity or digest changed.' }
          "SITEINDEX_EXPECTED_SOURCE_COMMIT=$source" >> $env:GITHUB_ENV
      - name: Download official baseline and verify EXE hash
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.8.0 --repo $env:GITHUB_REPOSITORY --pattern SiteIndex-Setup-0.8.0.exe --dir official-baseline
          $old = 'official-baseline/SiteIndex-Setup-0.8.0.exe'
          if ((Get-FileHash -LiteralPath $old -Algorithm SHA256).Hash.ToLowerInvariant() -cne '65232832171b12d5362c6ec21e6dcb3a542149bbf2e9d1529eacacdf324d7e22') { throw 'Official baseline EXE hash mismatch.' }
      - name: Record one isolated schedule #52 diagnostic
        timeout-minutes: 25
        env:
          SITEINDEX_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: node packages/desktop/scripts/e-windows-v082-schedule52-diagnostic.mjs official-baseline/SiteIndex-Setup-0.8.0.exe
      - name: Upload synthetic diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siteindex-v082-schedule52-diagnostic
          path: siteindex-v082-schedule52-diagnostic-results/
          if-no-files-found: warn
          retention-days: 14
